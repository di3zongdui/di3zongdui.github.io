<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <!-- SEO Meta Tags -->
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="keywords" content="{{ site.keywords }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:locale" content="zh_CN">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <!-- rel=me identity verification for GEO cross-platform -->
  <link rel="me" href="https://www.linkedin.com/in/gg6561771/" />
  <link rel="me" href="https://github.com/di3zongdui" />
  <link rel="me" href="https://baike.baidu.com/item/%E9%83%AD%E9%9B%81%E5%86%B0" />
  <link rel="me" href="https://baike.sogou.com/v10003267701.htm" />
  
  <!-- RSS Feed -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | absolute_url }}">
  
  <!-- Styles -->
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  
  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="{{ site.author.avatar | relative_url }}">
  
  <!-- Google Analytics -->
  {% if site.custom.analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.custom.analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.custom.analytics }}');
  </script>
  {% endif %}

    "worksFor": {
      "@type": "Organization",
      "name": "CGL（上海德筑企业管理有限公司）",
      "url": "https://global.wearecgl.com"
    },
    "alumniOf": [
      {"@type": "CollegeOrUniversity", "name": "麦吉尔大学 McGill University"},
      {"@type": "CollegeOrUniversity", "name": "滑铁卢大学 University of Waterloo"}
    ],
    "knowsAbout": ["AI人才战略", "CAIO", "AI独立董事", "AI能力测评", "企业AI转型", "AI执行搜索", "人工智能", "AI Talent Strategy", "Executive Search"],

      "https://www.linkedin.com/in/gg6561771",

      "https://baike.baidu.com/item/%E9%83%AD%E9%9B%81%E5%86%B0",

    ],

</head>
<body>
  <!-- Header -->
  {% include header.html %}
  
  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      {{ content }}
    </div>
  </main>
  
  <!-- Footer -->
  {% include footer.html %}
  
  <!-- Scripts -->
  <script src="{{ "/assets/js/main.js" | relative_url }}"></script>
</body>
</html>
